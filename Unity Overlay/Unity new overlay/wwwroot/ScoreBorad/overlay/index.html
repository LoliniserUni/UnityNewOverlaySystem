<!DOCTYPE html>
<link href="sbstyle.css" rel="stylesheet" />
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unity Overlay</title>
    <script type="module" src="overlay.js" defer></script>
</head>
<body>
    <div class="sb-scoreBoard"> </div>
    <div class="sb-backgroundGradient"> </div>
    <div class="sb-scoreBoardHolder">
        <div class="sb-titleBlock">
            <p class="sb-titleText" id="sb-titleText">RLCS 2025 - OPEN QUAL 1</p>
        </div>
        <div class="sb-teamTitleContainer">

            <div class="sb-gameTextContainer">
                <p class="sb-gameNumberText" id="sb-gameNumber">
                    GAME 5
                </p>
                <p class="sb-totalGamesText" id="sb-totalGames">
                    OF 7
                </p>
            </div>

            <div class="sb-blueTitleContainer">
                <div class="sb-blueTextBG">
                    <div class="sb-blueName">
                        <p id="sb-blueTeamName">UNITY ESPORTS</p>
                    </div>
                    <img class="sb-blueLogo" id="sb-blueLogo" />
                </div>
                <div class="sb-blueBorderTop"></div>
                <div class="sb-blueScoreContainer">
                    <p class="sb-blueScore" id="sb-blueScore">0</p>
                </div>
            </div>

            <div class="sb-orangeTitleContainer">
                <div class="sb-orangeTextBG">
                    <div class="sb-orangeName">
                        <p id="sb-orangeTeamName">UNITY ESPORTS</p>
                    </div>
                    <img class="sb-orangeLogo" id="sb-orangeLogo" />
                </div>
                <div class="sb-orangeBorderTop"></div>
                <div class="sb-orangeScoreContainer">
                    <p class="sb-orangeScore" id="sb-orangeScore">0</p>
                </div>
            </div>

            <div class="sb-gameStatsContainer">
                <div class="sb-playerListContainer">
                    <div class="sb-box">
                        <div class="sb-blueHalf">
                            <div class="sb-blueNamesLine"></div>
                            <div class="sb-blueNamesBackground"></div>
                            <div class="sb-blueGridContainer">
                                <div class="sb-grid">
                                    <p class="sb-bluePlayer" id="sb-bluePlayer1"></p>
                                    <p class="sb-bluePlayer" id="sb-bluePlayer2"></p>
                                    <p class="sb-bluePlayer" id="sb-bluePlayer3"></p>
                                </div>
                            </div>
                        </div>

                        <div class="sb-orangeHalf">
                            <div class="sb-orangeNamesLine"></div>
                            <div class="sb-orangeNamesBackground"></div>
                            <div class="sb-orangeGridContainer">
                                <div class="sb-grid">
                                    <p class="sb-bluePlayer" id="sb-orangePlayer1"></p>
                                    <p class="sb-bluePlayer" id="sb-orangePlayer2"></p>
                                    <p class="sb-bluePlayer" id="sb-orangePlayer3"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="sb-scoreBox">
                    <div class="sb-sbLine">
                        <div class="sb-centreTitle"><p class="sb-bluePlayer">SCORE</p></div>
                        <div class="sb-blueHalf">
                            <div class="sb-blueGridContainer">
                                <div class="sb-grid">
                                    <p class="sb-bluePlayer" id="sb-blueScore1"></p>
                                    <p class="sb-bluePlayer" id="sb-blueScore2"></p>
                                    <p class="sb-bluePlayer" id="sb-blueScore3"></p>
                                </div>
                            </div>
                        </div>
                        <div class="sb-orangeHalf">
                            <div class="sb-orangeGridContainer">
                                <div class="sb-grid">
                                    <p class="sb-bluePlayer" id="sb-orangeScore1"></p>
                                    <p class="sb-bluePlayer" id="sb-orangeScore2"></p>
                                    <p class="sb-bluePlayer" id="sb-orangeScore3"></p>
                                </div>
                            </div>
                        </div>
                        <div class="sb-centreLine">
                            <div id="sb-scoreSkew" class="sb-lineObject">
                                <div class="sb-centreLineBlue" id="sb-scoreLineBlue"></div>
                                <div class="sb-centreLineOrange" id="sb-scoreLineOrange"></div>
                                <div class="sb-centreLineCentre" id="sb-scoreLineCentre"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Repeat for Goals, Assists, Shots, Saves, Touches, Demos -->
                <div class="sb-goalsBox">
                    <div class="sb-sbLine">
                        <div class="sb-centreTitle"><p class="sb-bluePlayer">GOALS</p></div>
                        <div class="sb-blueHalf"><div class="sb-blueGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-blueGoals1"></p><p class="sb-bluePlayer" id="sb-blueGoals2"></p><p class="sb-bluePlayer" id="sb-blueGoals3"></p></div></div></div>
                        <div class="sb-orangeHalf"><div class="sb-orangeGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-orangeGoals1"></p><p class="sb-bluePlayer" id="sb-orangeGoals2"></p><p class="sb-bluePlayer" id="sb-orangeGoals3"></p></div></div></div>
                        <div class="sb-centreLine"><div id="sb-goalsSkew" class="sb-lineObject"><div class="sb-centreLineBlue"></div><div class="sb-centreLineOrange"></div><div class="sb-centreLineCentre"></div></div></div>
                    </div>
                </div>

                <div class="sb-assistsBox">
                    <div class="sb-sbLine">
                        <div class="sb-centreTitle"><p class="sb-bluePlayer">ASSISTS</p></div>
                        <div class="sb-blueHalf"><div class="sb-blueGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-blueAssists1"></p><p class="sb-bluePlayer" id="sb-blueAssists2"></p><p class="sb-bluePlayer" id="sb-blueAssists3"></p></div></div></div>
                        <div class="sb-orangeHalf"><div class="sb-orangeGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-orangeAssists1"></p><p class="sb-bluePlayer" id="sb-orangeAssists2"></p><p class="sb-bluePlayer" id="sb-orangeAssists3"></p></div></div></div>
                        <div class="sb-centreLine"><div id="sb-assistsSkew" class="sb-lineObject"><div class="sb-centreLineBlue"></div><div class="sb-centreLineOrange"></div><div class="sb-centreLineCentre"></div></div></div>
                    </div>
                </div>

                <div class="sb-shotsBox">
                    <div class="sb-sbLine">
                        <div class="sb-centreTitle"><p class="sb-bluePlayer">SHOTS</p></div>
                        <div class="sb-blueHalf"><div class="sb-blueGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-blueShots1"></p><p class="sb-bluePlayer" id="sb-blueShots2"></p><p class="sb-bluePlayer" id="sb-blueShots3"></p></div></div></div>
                        <div class="sb-orangeHalf"><div class="sb-orangeGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-orangeShots1"></p><p class="sb-bluePlayer" id="sb-orangeShots2"></p><p class="sb-bluePlayer" id="sb-orangeShots3"></p></div></div></div>
                        <div class="sb-centreLine"><div id="sb-shotsSkew" class="sb-lineObject"><div class="sb-centreLineBlue"></div><div class="sb-centreLineOrange"></div><div class="sb-centreLineCentre"></div></div></div>
                    </div>
                </div>

                <div class="sb-savesBox">
                    <div class="sb-sbLine">
                        <div class="sb-centreTitle"><p class="sb-bluePlayer">SAVES</p></div>
                        <div class="sb-blueHalf"><div class="sb-blueGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-blueSaves1"></p><p class="sb-bluePlayer" id="sb-blueSaves2"></p><p class="sb-bluePlayer" id="sb-blueSaves3"></p></div></div></div>
                        <div class="sb-orangeHalf"><div class="sb-orangeGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-orangeSaves1"></p><p class="sb-bluePlayer" id="sb-orangeSaves2"></p><p class="sb-bluePlayer" id="sb-orangeSaves3"></p></div></div></div>
                        <div class="sb-centreLine"><div id="sb-savesSkew" class="sb-lineObject"><div class="sb-centreLineBlue"></div><div class="sb-centreLineOrange"></div><div class="sb-centreLineCentre"></div></div></div>
                    </div>
                </div>

                <div class="sb-touchesBox">
                    <div class="sb-sbLine">
                        <div class="sb-centreTitle"><p class="sb-bluePlayer">BALL TOUCHES</p></div>
                        <div class="sb-blueHalf"><div class="sb-blueGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-blueTouches1"></p><p class="sb-bluePlayer" id="sb-blueTouches2"></p><p class="sb-bluePlayer" id="sb-blueTouches3"></p></div></div></div>
                        <div class="sb-orangeHalf"><div class="sb-orangeGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-orangeTouches1"></p><p class="sb-bluePlayer" id="sb-orangeTouches2"></p><p class="sb-bluePlayer" id="sb-orangeTouches3"></p></div></div></div>
                        <div class="sb-centreLine"><div id="sb-touchesSkew" class="sb-lineObject"><div class="sb-centreLineBlue"></div><div class="sb-centreLineOrange"></div><div class="sb-centreLineCentre"></div></div></div>
                    </div>
                </div>

                <div class="sb-demoBox">
                    <div class="sb-sbLine">
                        <div class="sb-centreTitle"><p class="sb-bluePlayer">DEMOS</p></div>
                        <div class="sb-blueHalf"><div class="sb-blueGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-blueDemos1"></p><p class="sb-bluePlayer" id="sb-blueDemos2"></p><p class="sb-bluePlayer" id="sb-blueDemos3"></p></div></div></div>
                        <div class="sb-orangeHalf"><div class="sb-orangeGridContainer"><div class="sb-grid"><p class="sb-bluePlayer" id="sb-orangeDemos1"></p><p class="sb-bluePlayer" id="sb-orangeDemos2"></p><p class="sb-bluePlayer" id="sb-orangeDemos3"></p></div></div></div>
                        <div class="sb-centreLine">
                            <div id="sb-demosSkew" class="sb-lineObject">
                                <div class="sb-centreLineBlue"></div>
                                <div class="sb-centreLineOrange"></div>
                                <div class="sb-centreLineCentre"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>



        </div>
        </div>
</body>
</html>
