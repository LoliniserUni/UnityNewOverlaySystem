<!DOCTYPE html>
<link href="sbstyle.css" rel="stylesheet" />
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unity Overlay</title>
    <script type="module" src="overlay.js" defer></script>
</head>
<body>
    <div class="scoreBoard"> </div>
    <div class="backgroundGradient"> </div>
    <div class="scoreBoardHolder">
        <div class="titleBlock">
            <p class="titleText" id="titleText">RLCS 2025 - OPEN QUAL 1</p>
        </div>
        <div class="teamTitleContainer">

            <div class="gameTextContainer">
                <p class="gameNumberText" id="gameNumber">
                    GAME 5
                </p>
                <p class="totalGamesText" id="totalGames">
                    OF 7
                </p>
            </div>

            <div class="blueTitleContainer">
                <div class="blueTextBG">
                    <div class="blueName">
                        <p id="blueTeamName">UNITY ESPORTS</p>
                    </div>
                    <img class="blueLogo" id="blueLogo" />
                </div>
                <div class="blueBorderTop"></div>
                <div class="blueScoreContainer">
                    <p class="blueScore" id="blueScore">0</p>
                </div>
            </div>

            <div class="orangeTitleContainer">
                <div class="orangeTextBG">
                    <div class="orangeName">
                        <p id="orangeTeamName">UNITY ESPORTS</p>
                    </div>
                    <img class="orangeLogo" id="orangeLogo" />
                </div>
                <div class="orangeBorderTop"></div>
                <div class="orangeScoreContainer">
                    <p class="orangeScore" id="orangeScore">0</p>
                </div>
            </div>

            <div class="gameStatsContainer">
                <div class="playerListContainer">
                    <div class="box">
                        <div class="blueHalf">
                            <div class="blueNamesLine"></div>
                            <div class="blueNamesBackground"></div>
                            <div class="blueGridContainer">
                                <div class="grid">
                                    <p class="bluePlayer" id="bluePlayer1"></p>
                                    <p class="bluePlayer" id="bluePlayer2"></p>
                                    <p class="bluePlayer" id="bluePlayer3"></p>
                                </div>
                            </div>
                        </div>

                        <div class="orangeHalf">
                            <div class="orangeNamesLine"></div>
                            <div class="orangeNamesBackground"></div>
                            <div class="orangeGridContainer">
                                <div class="grid">
                                    <p class="bluePlayer" id="orangePlayer1"></p>
                                    <p class="bluePlayer" id="orangePlayer2"></p>
                                    <p class="bluePlayer" id="orangePlayer3"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="scoreBox">
                    <div class="sbLine">
                        <div class="centreTitle"><p class="bluePlayer">SCORE</p></div>
                        <div class="blueHalf">
                            <div class="blueGridContainer">
                                <div class="grid">
                                    <p class="bluePlayer" id="blueScore1"></p>
                                    <p class="bluePlayer" id="blueScore2"></p>
                                    <p class="bluePlayer" id="blueScore3"></p>
                                </div>
                            </div>
                        </div>
                        <div class="orangeHalf">
                            <div class="orangeGridContainer">
                                <div class="grid">
                                    <p class="bluePlayer" id="orangeScore1"></p>
                                    <p class="bluePlayer" id="orangeScore2"></p>
                                    <p class="bluePlayer" id="orangeScore3"></p>
                                </div>
                            </div>
                        </div>
                        <div class="centreLine">
                            <div id="scoreSkew" class="lineObject">
                                <div class="centreLineBlue" id="scoreLineBlue"></div>
                                <div class="centreLineOrange" id="scoreLineOrange"></div>
                                <div class="centreLineCentre" id="scoreLineCentre"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Repeat for Goals, Assists, Shots, Saves, Touches, Demos -->
                <div class="goalsBox">
                    <div class="sbLine">
                        <div class="centreTitle"><p class="bluePlayer">GOALS</p></div>
                        <div class="blueHalf"><div class="blueGridContainer"><div class="grid"><p class="bluePlayer" id="blueGoals1"></p><p class="bluePlayer" id="blueGoals2"></p><p class="bluePlayer" id="blueGoals3"></p></div></div></div>
                        <div class="orangeHalf"><div class="orangeGridContainer"><div class="grid"><p class="bluePlayer" id="orangeGoals1"></p><p class="bluePlayer" id="orangeGoals2"></p><p class="bluePlayer" id="orangeGoals3"></p></div></div></div>
                        <div class="centreLine"><div id="goalsSkew" class="lineObject"><div class="centreLineBlue"></div><div class="centreLineOrange"></div><div class="centreLineCentre"></div></div></div>
                    </div>
                </div>

                <div class="assistsBox">
                    <div class="sbLine">
                        <div class="centreTitle"><p class="bluePlayer">ASSISTS</p></div>
                        <div class="blueHalf"><div class="blueGridContainer"><div class="grid"><p class="bluePlayer" id="blueAssists1"></p><p class="bluePlayer" id="blueAssists2"></p><p class="bluePlayer" id="blueAssists3"></p></div></div></div>
                        <div class="orangeHalf"><div class="orangeGridContainer"><div class="grid"><p class="bluePlayer" id="orangeAssists1"></p><p class="bluePlayer" id="orangeAssists2"></p><p class="bluePlayer" id="orangeAssists3"></p></div></div></div>
                        <div class="centreLine"><div id="assistsSkew" class="lineObject"><div class="centreLineBlue"></div><div class="centreLineOrange"></div><div class="centreLineCentre"></div></div></div>
                    </div>
                </div>

                <div class="shotsBox">
                    <div class="sbLine">
                        <div class="centreTitle"><p class="bluePlayer">SHOTS</p></div>
                        <div class="blueHalf"><div class="blueGridContainer"><div class="grid"><p class="bluePlayer" id="blueShots1"></p><p class="bluePlayer" id="blueShots2"></p><p class="bluePlayer" id="blueShots3"></p></div></div></div>
                        <div class="orangeHalf"><div class="orangeGridContainer"><div class="grid"><p class="bluePlayer" id="orangeShots1"></p><p class="bluePlayer" id="orangeShots2"></p><p class="bluePlayer" id="orangeShots3"></p></div></div></div>
                        <div class="centreLine"><div id="shotsSkew" class="lineObject"><div class="centreLineBlue"></div><div class="centreLineOrange"></div><div class="centreLineCentre"></div></div></div>
                    </div>
                </div>

                <div class="savesBox">
                    <div class="sbLine">
                        <div class="centreTitle"><p class="bluePlayer">SAVES</p></div>
                        <div class="blueHalf"><div class="blueGridContainer"><div class="grid"><p class="bluePlayer" id="blueSaves1"></p><p class="bluePlayer" id="blueSaves2"></p><p class="bluePlayer" id="blueSaves3"></p></div></div></div>
                        <div class="orangeHalf"><div class="orangeGridContainer"><div class="grid"><p class="bluePlayer" id="orangeSaves1"></p><p class="bluePlayer" id="orangeSaves2"></p><p class="bluePlayer" id="orangeSaves3"></p></div></div></div>
                        <div class="centreLine"><div id="savesSkew" class="lineObject"><div class="centreLineBlue"></div><div class="centreLineOrange"></div><div class="centreLineCentre"></div></div></div>
                    </div>
                </div>

                <div class="touchesBox">
                    <div class="sbLine">
                        <div class="centreTitle"><p class="bluePlayer">BALL TOUCHES</p></div>
                        <div class="blueHalf"><div class="blueGridContainer"><div class="grid"><p class="bluePlayer" id="blueTouches1"></p><p class="bluePlayer" id="blueTouches2"></p><p class="bluePlayer" id="blueTouches3"></p></div></div></div>
                        <div class="orangeHalf"><div class="orangeGridContainer"><div class="grid"><p class="bluePlayer" id="orangeTouches1"></p><p class="bluePlayer" id="orangeTouches2"></p><p class="bluePlayer" id="orangeTouches3"></p></div></div></div>
                        <div class="centreLine"><div id="touchesSkew" class="lineObject"><div class="centreLineBlue"></div><div class="centreLineOrange"></div><div class="centreLineCentre"></div></div></div>
                    </div>
                </div>

                <div class="demoBox">
                    <div class="sbLine">
                        <div class="centreTitle"><p class="bluePlayer">DEMOS</p></div>
                        <div class="blueHalf"><div class="blueGridContainer"><div class="grid"><p class="bluePlayer" id="blueDemos1"></p><p class="bluePlayer" id="blueDemos2"></p><p class="bluePlayer" id="blueDemos3"></p></div></div></div>
                        <div class="orangeHalf"><div class="orangeGridContainer"><div class="grid"><p class="bluePlayer" id="orangeDemos1"></p><p class="bluePlayer" id="orangeDemos2"></p><p class="bluePlayer" id="orangeDemos3"></p></div></div></div>
                        <div class="centreLine"><div id="demosSkew" class="lineObject"><div class="centreLineBlue"></div><div class="centreLineOrange"></div><div class="centreLineCentre"></div></div></div>
                    </div>
                </div>
            </div>



        </div>
        </div>
</body>
</html>
